<body class = "data-submission-body">
    <!-- <button id="toggleSidebarButton" class="toggle-button">☰</button> -->

    <div id="sidebar" class="sidebar">
        <div class="button-container">
            <button onclick="generateOverviewPage(control)" class="add-button">Overview</button>
            <!-- <button onclick="addStatementSet(control)" class="add-button">Add a set of Statements</button> -->
        </div>
        <ul id="sidebarList">
            <!-- Sidebar elements will be dynamically added here -->
        </ul>
    </div>
   
    <div class="content" id="content">
        <!-- Content will be dynamically updated here -->
        <h2>Welcome</h2>
        <p>Select an item from the sidebar to see details.</p>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to remove this item?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Yes, Delete</button>
            </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModalSubmission" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel">Confirm Submission</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                The submission was successful. Please send the downloaded .json file (submission) to us via email.
                <a href="#" id="email-success1">[email protected]</a>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="confirmEmailBtn">Got it!</button>
            </div>
            </div>
        </div>
    </div>
      

    <script>
        // Initialize control object
        var control = {
            publication_info: {},
            task_info: {},
            testing: false,
        };

        // // Toggle sidebar visibility
        // document.getElementById('toggleSidebarButton').onclick = function() {
        //     const sidebar = document.getElementById('sidebar');
        //     const content = document.getElementById('content');
        //     const toggleButton = document.getElementById('toggleSidebarButton');
        //     sidebar.classList.toggle('hidden');
        //     content.classList.toggle('expanded');
        //     toggleButton.classList.toggle('moved');
        // };

        // setup publication
        addPublication(control);

        //setup statement set
        addTaskOverview(control);

        // Load the overview page
        generateOverviewPage(control);
    </script>
